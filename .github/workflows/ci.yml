name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v5

      - name: Install Boost and OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libboost-system-dev libssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEDGEFLOW_SANITIZE=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test benchmarks
        # Covers both queue implementations and the new SPMC fixture. The filter is
        # a regex, so this matches every template instantiation of both names.
        run: ./build/benchmarks/edgeflow-benchmarks --benchmark_min_time=1x --benchmark_filter='BM_Queue_SingleThreaded|BM_Queue_SPMC_Push'

  backend:
    runs-on: ubuntu-latest
    # A hung jest run otherwise holds the job for GitHub's 6-hour default.
    timeout-minutes: 30
    # Postgres and Redis come from docker-compose.yml rather than Actions
    # services: the reconnect tests stop and start Redis with `docker compose`,
    # which cannot touch a service container.
    env:
      DATABASE_URL: postgres://edgeflow:edgeflow@localhost:5433/edgeflow
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v5

      - name: Start Postgres and Redis
        run: docker compose up --detach --wait

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Boost and OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libboost-system-dev libssl-dev

      - name: Build gateway and simulator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEDGEFLOW_SANITIZE=off
          cmake --build build --parallel --target edgeflow-gateway edgeflow-simulator

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Migrate
        working-directory: backend
        run: npm run migrate

      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
