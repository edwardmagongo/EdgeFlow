# Local PostgreSQL and Redis for backend development and tests. CI starts this
# same file with `docker compose up --wait`, so both environments run identical
# containers on identical ports. That matters beyond tidiness: the Redis
# reconnect tests in backend/test/idempotency.service.spec.ts cause a real
# outage with `docker compose stop redis`, which can only work where Redis is a
# compose-managed container.
#
# Host ports are non-default (5433, 6380) because this machine already runs
# unrelated postgres/redis containers bound to 5432/6379. Only the host side
# of the mapping changes; the containers still listen on 5432/6379
# internally. Set DATABASE_URL/REDIS_URL accordingly, e.g.:
#   DATABASE_URL=postgres://edgeflow:edgeflow@localhost:5433/edgeflow
#   REDIS_URL=redis://localhost:6380
#
# postgres:16-alpine rather than postgres:16: it was already cached locally,
# where postgres:16 was not and a slow pull stalled local verification. Same
# PostgreSQL 16 server either way.
#
# The project name is pinned so every git worktree targets the same containers.
# Left to default, compose names the project after the directory, so
# `docker compose stop redis` run from a worktree (e.g. EdgeFlow-deploy) found
# no containers, stopped nothing, and the reconnect tests hung without output.
name: edgeflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edgeflow
      POSTGRES_PASSWORD: edgeflow
      POSTGRES_DB: edgeflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeflow"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
